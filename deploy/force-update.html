<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gatz. Hub — جارٍ التحديث...</title>
<style>
  body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#9B1B3E;color:#fff;font-family:system-ui,'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;text-align:center;padding:24px}
  .spin{width:44px;height:44px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  h1{font-size:1.15rem;margin:0}
  p{opacity:.9;font-size:.9rem;margin:0;line-height:1.7}
  a{color:#fff;text-decoration:underline;font-weight:700}
  .err{display:none;background:rgba(0,0,0,.2);border-radius:10px;padding:12px 16px;font-size:.82rem;max-width:420px}
</style>
</head>
<body>
  <div class="spin"></div>
  <h1>جارٍ تحديث Gatz. Hub...</h1>
  <p>بنمسح النسخة القديمة من الكاش من غير لمس بياناتك.</p>
  <div class="err" id="err"></div>
  <p><a href="restaurant-booking-v2.html">اضغط هنا لو استغرق الوقت</a></p>
  <noscript><p>يفضّل تفعيل JavaScript عشان التحديث يتم تلقائياً.</p></noscript>

<script>
(async function () {
  const target = 'restaurant-booking-v2.html?v=' + Date.now();
  const errBox = document.getElementById('err');

  function fail(e) {
    if (errBox) {
      errBox.style.display = 'block';
      errBox.textContent = 'حصلت مشكلة بسيطة: ' + (e && e.message ? e.message : e) + ' — هيفتح التطبيق على أي حال.';
    }
  }

  try {
    // ١) إلغاء أي Service Worker قديم (مش بيلمس localStorage)
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister().catch(() => {})));
    }
  } catch (e) { fail(e); }

  try {
    // ٢) حذف كاش الملفات القديم فقط (Cache Storage — مش localStorage)
    if (window.caches && caches.keys) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k).catch(() => {})));
    }
  } catch (e) { fail(e); }

  // ٣) فتح النسخة الجديدة برابط فريد (بيكسر كاش CDN كمان)
  location.replace(target);
})();
</script>
</body>
</html>
