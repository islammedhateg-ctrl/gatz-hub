<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
if (location.protocol === 'http:' && !['127.0.0.1','localhost'].includes(location.hostname)) {
  location.replace('https://' + location.host + location.pathname + location.search + location.hash);
}
</script>
<title>Gatz. Hub — جارٍ التحديث...</title>
<style>
  body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#9B1B3E;color:#fff;font-family:system-ui,'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;text-align:center;padding:24px}
  .spin{width:44px;height:44px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  h1{font-size:1.15rem;margin:0}
  p{opacity:.9;font-size:.9rem;margin:0;line-height:1.7}
  a{color:#fff;text-decoration:underline;font-weight:700}
</style>
</head>
<body>
  <div class="spin"></div>
  <h1>جارٍ فتح النسخة الجديدة...</h1>
  <p>التطبيق هيبتدى على طول — بياناتك مش هتتلمس.</p>
  <p><a id="manual-link" href="restaurant-booking-v2.html">اضغط هنا لو ما حصلش تحويل</a></p>
  <noscript><p>يفضّل تفعيل JavaScript عشان التحويل يتم تلقائياً، أو اضغط على اللينك فوق.</p></noscript>

<script>
(function () {
  const local = ['127.0.0.1','localhost'].includes(location.hostname);
  const base = local ? '' : 'https://' + location.host + '/';
  const target = base + 'restaurant-booking-v2.html?fresh=1&v=' + Date.now();
  const link = document.getElementById('manual-link');
  if (link) link.href = target;

  // متعملش unregister للـ Service Worker ولا caches.delete():
  // لو الشبكة فشلت، الكاش هو البديل الوحيد اللي بيخلي التطبيق يشتغل.
  // الرابط الجديد different بـ ?v= فبيجلب HTML جديد من الشبكة لو متاحة.
  location.replace(target);
  setTimeout(function () { window.location.href = target; }, 1500);
})();
</script>
</body>
</html>
